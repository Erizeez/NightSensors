<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090014"/>
      <stop offset="50%" stop-color="#14012B"/>
      <stop offset="100%" stop-color="#05000A"/>
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#FA709A"/>
    </linearGradient>
    <linearGradient id="meshGrad" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#F72585" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7209B7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4CC9F0" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg2)"/>

  <!-- 3D 空间网格透视地平线 (Mesh Terrain) -->
  <g stroke="#F72585" stroke-opacity="0.4" stroke-width="2">
    <!-- 纵向透视线收敛到中心消失点 -->
    <line x1="512" y1="512" x2="60" y2="980"/>
    <line x1="512" y1="512" x2="220" y2="980"/>
    <line x1="512" y1="512" x2="380" y2="980"/>
    <line x1="512" y1="512" x2="512" y2="980"/>
    <line x1="512" y1="512" x2="644" y2="980"/>
    <line x1="512" y1="512" x2="804" y2="980"/>
    <line x1="512" y1="512" x2="964" y2="980"/>

    <!-- 横向等高线 (间距随透视放大) -->
    <line x1="432" y1="550" x2="592" y2="550"/>
    <line x1="372" y1="600" x2="652" y2="600"/>
    <line x1="292" y1="670" x2="732" y2="670"/>
    <line x1="192" y1="760" x2="832" y2="760"/>
    <line x1="82" y1="880" x2="942" y2="880" stroke-width="3" stroke="#4CC9F0" stroke-opacity="0.6"/>
  </g>

  <!-- 顶部赛博朋克空间几何多面体 (Sensory Prism) -->
  <g filter="url(#glow2)">
    <!-- 外围等边感知六边形 -->
    <polygon points="512,180 772,330 772,630 512,780 252,630 252,330" fill="none" stroke="url(#cyanPurple)" stroke-width="6"/>
    
    <!-- 内部空间坐标连接棱线 -->
    <line x1="512" y1="180" x2="512" y2="512" stroke="#00F2FE" stroke-width="4"/>
    <line x1="772" y1="330" x2="512" y2="512" stroke="#FA709A" stroke-width="4"/>
    <line x1="772" y1="630" x2="512" y2="512" stroke="#7209B7" stroke-width="4"/>
    <line x1="512" y1="780" x2="512" y2="512" stroke="#00F2FE" stroke-width="4"/>
    <line x1="252" y1="630" x2="512" y2="512" stroke="#FA709A" stroke-width="4"/>
    <line x1="252" y1="330" x2="512" y2="512" stroke="#7209B7" stroke-width="4"/>
  </g>

  <!-- 顶点感知粒子点云 -->
  <circle cx="512" cy="180" r="10" fill="#00F2FE" filter="url(#glow2)"/>
  <circle cx="772" cy="330" r="10" fill="#FA709A" filter="url(#glow2)"/>
  <circle cx="772" cy="630" r="10" fill="#4CC9F0" filter="url(#glow2)"/>
  <circle cx="512" cy="780" r="10" fill="#00F2FE" filter="url(#glow2)"/>
  <circle cx="252" cy="630" r="10" fill="#FA709A" filter="url(#glow2)"/>
  <circle cx="252" cy="330" r="10" fill="#4CC9F0" filter="url(#glow2)"/>

  <!-- 中心核心能量珠 -->
  <circle cx="512" cy="512" r="32" fill="#FFFFFF" filter="url(#glow2)"/>
  <circle cx="512" cy="512" r="18" fill="#00F2FE"/>
</svg>