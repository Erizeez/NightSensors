<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="sweepGrad" x1="50%" y1="50%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg5)"/>

  <!-- 极简纤细同心圆环 -->
  <circle cx="512" cy="512" r="390" fill="none" stroke="#1E293B" stroke-width="2"/>
  <circle cx="512" cy="512" r="300" fill="none" stroke="#334155" stroke-width="2.5"/>
  <circle cx="512" cy="512" r="210" fill="none" stroke="#0284C7" stroke-opacity="0.5" stroke-width="3"/>
  <circle cx="512" cy="512" r="120" fill="none" stroke="#38BDF8" stroke-width="4"/>

  <!-- 90度主测距象限刻度 -->
  <circle cx="512" cy="122" r="6" fill="#38BDF8"/>
  <circle cx="902" cy="512" r="6" fill="#38BDF8"/>
  <circle cx="512" cy="902" r="6" fill="#38BDF8"/>
  <circle cx="122" cy="512" r="6" fill="#38BDF8"/>

  <!-- 45度高精度动态测距扇形光锥 -->
  <path d="M 512 512 L 778 246 A 376 376 0 0 0 512 136 Z" fill="url(#sweepGrad)"/>

  <!-- 极简十字瞄准线 (带端点微距) -->
  <line x1="512" y1="230" x2="512" y2="450" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <line x1="512" y1="574" x2="512" y2="794" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <line x1="230" y1="512" x2="450" y2="512" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <line x1="574" y1="512" x2="794" y2="512" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>

  <!-- 目标捕获框角标 (Target Lock) -->
  <path d="M 332 372 L 332 332 L 372 332" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  <path d="M 692 372 L 692 332 L 652 332" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  <path d="M 332 652 L 332 692 L 372 692" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  <path d="M 692 652 L 692 692 L 652 692" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>

  <!-- 极纯净高亮中央光核 -->
  <circle cx="512" cy="512" r="24" fill="url(#cyanAccent)" filter="url(#glow5)"/>
  <circle cx="512" cy="512" r="10" fill="#FFFFFF"/>
</svg>