name: NightSensors
options:
  bundleIdPrefix: com.sail
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  NightSensors:
    type: application
    platform: iOS
    sources:
      - path: NightSensors
    settings:
      base:
        INFOPLIST_FILE: NightSensors/App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.sail.NightSensors
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: NO
    frameworks:
      - sdk: ARKit.framework
      - sdk: MetalKit.framework
      - sdk: Metal.framework
      - sdk: CoreMotion.framework
      - sdk: CoreHaptics.framework
      - sdk: AVFoundation.framework
      - sdk: CoreImage.framework

  NightSensorsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NightSensorsTests
    dependencies:
      - target: NightSensors
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sail.NightSensorsTests
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
